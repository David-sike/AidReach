<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Campaign</title>
  <link rel="stylesheet" href="styles.css"/>
  </head>
<body>
  <nav class="navbar">
    <img src="SDP/logo.png" alt="Logo" class="nav-logo" style="height:40px;">
    <ul class="nav-links" id="nav-links">
      <li><a class="home">Home</a></li>
      <li class="dropdown">
        <a class="dropdown-toggle">Choose a cause</a>
        <ul class="dropdown-menu">
          <li><a class="donate">Donate</a></li>
          <li><a class="yourDonations">Your donations</a></li>
        </ul>
      </li>
      <li class="dropdown">
        <a class="dropdown-toggle">Campaign</a>
        <ul class="dropdown-menu">
          <li><a class="createCampaign">Create a campaign</a></li>
          <li><a class="yourCampaign">Your Campaigns</a></li>
        </ul>
      </li>
    </ul>
    <div class="nav-buttons">
      <button class="sign-in">Sign in →</button>
      <button class="get-started">Get Started</button>
    </div>
  </nav>
    <div class="campaign-container">
        <div class="logo">
            <img src="SDP/Logo.png" alt="Company Logo">
        </div>
        <div id="message-box"></div>


        <div id="campaign-message" class="campaign-message"></div>



        <h1>Start a Campaign</h1>
        <p class="subtitle">Fill out the form with all the necessary information.</p>
        
        <form class="campaign-form" id ="campaign-form">
            <div class="form-group">
                <input type="text" id="organizer" name="organizer" placeholder="Campaign Organizer (Full Name)" required>
            </div>
            
            <div class="form-group">
            <input type="text" id="title" name="title" placeholder="Campaign Title" required>
            </div>
            
            <div class="form-group">
                <input type="text" id="location" name="location" placeholder="Location" required>
            </div>
            
            <div class="form-group">
               <input type="number" id="goal" name="goal" placeholder="Goal Amount" required>
            </div>
            
            <div class="form-group">
                <input type="text" id="account" name="account" placeholder="Account Number" required>
            </div>

            <div class="form-group">
                <input type="text" id="account-name" name="account-name" placeholder="Account Name" required>
            </div>
           
            <div class="form-row">
                <div class="form-group half-width">
                    <label for="start-date">Start Date</label>
                    <input type="date" id="start-date" name="start-date"required>
                </div>
                
                <div class="form-group half-width">
                    <label for="end-date">End Date</label>
                    <input type="date" id="end-date" name="end-date" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="description">Talk about your campaign, Brief summary/overview</label>
                <textarea id="description" name="description" rows="5" required></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group half-width">
                    <label>Upload Cover Photo</label>
                    <div class="upload-box">
                        <input type="file" id="cover-photo" name="cover-photo" accept="image/*" required>
                        <label for="cover-photo" class="upload-label">Choose File</label>
                    </div>
                </div>
                
                <div class="form-group half-width">
                    <label>Upload Additional Photos (optional)</label>
                    <div class="upload-box">
                        <input type="file" id="additional-photos" name="additional-photos" accept="image/*" multiple>
                        <label for="additional-photos" class="upload-label">Choose Files</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <p class="file-note">Attach file. File size of your documents should not exceed 10MB</p>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I want to agree to all the <a href ="#">terms and conditions</a></label>
            </div>
            
            <button type="submit" class="publish-btn">POST CAMPAIGN</button>
        </form>
    </div>


<div id="footer-placeholder"></div>
<script type="module" src="firebase.js"></script>
<script type="module" src="navbar.js"></script>
<script src="newCampaign.js"></script>
<script src="main.js"></script>
<script src="footer.js"></script>
</body>
</html>
