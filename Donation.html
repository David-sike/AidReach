<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar" style="display: flex; align-items: center; justify-content: space-between;">
    <img src="SDP/logo.png" alt="Logo" class="nav-logo" style="height:40px; margin-right: 20px;">
    <ul class="nav-links" id="nav-links" style="display: flex; justify-content: center; flex: 1; list-style: none; padding: 0; margin: 0;">
        <li style="margin: 0 15px;"><a class="home">Home</a></li>
        <li class="dropdown" style="margin: 0 15px;">
            <a class="dropdown-toggle">Choose a cause</a>
            <ul class="dropdown-menu">
                <li><a class="donate">Donate</a></li>
                <li><a class="yourDonations">Your donations</a></li>
            </ul>
        </li>
        <li class="dropdown" style="margin: 0 15px;">
            <a class="dropdown-toggle">Campaign</a>
            <ul class="dropdown-menu">
                <li><a class="createCampaign">Create a campaign</a></li>
                <li><a class="yourCampaign">Your Campaigns</a></li>
            </ul>
        </li>
    </ul>
</nav>
<div class="donation-header">
    <h1>Choose where to donate</h1>
    <p>Each Donation goes directly to the campaign selected.</p>
</div> 

<div class="donation-grid">
    <p style="text-align:center; padding:20px; color:#64748b;">
        Loading campaigns...
    </p>
</div>


</div>
<div id="footer-placeholder"></div>
<script type="module" src="firebase.js"></script>
<script type="module" src="navbar.js"></script>
<script src="donation.js"></script>
<script src="main.js"></script>
<script src="footer.js"></script>

</body>
</html>
