<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AidReach – Admin Dashboard</title>
  <style>
    :root{
      --bg:#f4f6f8;
      --panel:#ffffff;
      --ink:#0b2239;
      --muted:#6b7c8f;
      --brand:#3b82f6;
      --accent:#edf2ff;
      --card:#ffffff;
      --green:#22c55e;
      --red:#ef4444;
      --amber:#f59e0b;
      --shadow:0 10px 22px rgba(20,30,55,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
    }

    /* Layout */
    .layout{
      min-height:100svh;
      display:grid;
      grid-template-columns: 260px 1fr;
      gap:24px;
    }
    @media ((min-width: auto) and (max-width: 768px)){
      .layout{ grid-template-columns: 1fr }
      aside{ position:relative; top:0; z-index:5 }
    }

    /* Sidebar */
    aside{
      background:#fff;
      padding:18px 14px;
      box-shadow:var(--shadow);
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      padding:12px 10px 18px;
      font-weight:800; letter-spacing:.2px;
      color:var(--brand);
      font-size:20px;
    }
    .brand .dot{ width:12px; height:12px; border-radius:50%; background:var(--brand) }
    nav{ margin-top:8px }
    .nav-item{
      display:flex; align-items:center; gap:12px;
      padding:12px 14px;
      border-radius:12px;
      color:var(--ink);
      text-decoration:none;
      margin:6px 6px;
    }
    .nav-item:hover{ background:#f2f6ff }
    .nav-item.active{ background:#e8efff; color:#1e40af; font-weight:700 }
    .nav-icon{
      width:18px; height:18px; display:inline-grid; place-items:center;
      color:#476287;
    }
    .sidebar-footer{ margin-top: 145vh; padding-top:16px; border-top:1px dashed #e2e8f0 }

    /* Main */
    main{ padding:18px 18px 32px }
    .topbar{
      background:var(--panel); border-radius:14px; padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
      box-shadow:var(--shadow); margin-bottom:18px;
    }
    .tb-left{ font-weight:800; font-size:18px; color:#2a3a4f; opacity:.9 }
    .tb-right{ display:flex; align-items:center; gap:16px; color:var(--muted) }
    .lang{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:#f1f5f9 }
    .avatar{
      width:34px; height:34px; border-radius:50%;
      background:linear-gradient(135deg,#fda4af,#a78bfa);
    }
    /* Profile dropdown styles */
    .profile-dropdown {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .profile-dropdown small{ display:block; font-size:12px; color:var(--muted) }
    .profile-dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #fff;
      border: 1px solid #e5e9f2;
      border-radius: 12px;
      box-shadow: var(--shadow);
      list-style: none;
      margin: 0;
      padding: 8px 0;
      z-index: 1000;
      min-width: 160px;
    }
    .profile-dropdown-menu li { margin:0; padding:0; }
    .profile-dropdown-menu li a {
      display: block;
      padding: 8px 16px;
      font-size: 14px;
      color: var(--ink);
      text-decoration: none;
    }
    .profile-dropdown-menu li a:hover {
      background: #f1f5f9;
    }
    .profile-dropdown:hover .profile-dropdown-menu {
      display: block;
    }

    .content{
      display:grid;
      grid-template-columns: 1fr;
      gap:18px;
    }

    /* Stat cards */
    .stats{
      display:grid;
      grid-template-columns: repeat(4, minmax(180px,1fr));
      gap:16px;
    }
    @media (max-width: 1100px){ .stats{ grid-template-columns: repeat(2,1fr) } }
    @media (max-width: 600px){ .stats{ grid-template-columns: 1fr } }

    .card{
      background:var(--card); border-radius:16px; padding:16px;
      box-shadow:var(--shadow);
    }
    .stat{
      display:grid; grid-template-columns: 1fr auto; row-gap:8px; column-gap:10px;
    }
    .stat h4{ margin:0; font-size:13px; color:var(--muted); font-weight:700 }
    .stat .icon{
      width:36px; height:36px; border-radius:12px; display:grid; place-items:center;
      background:#f1f5f9;
    }
    .stat .value{ font-size:28px; font-weight:800; letter-spacing:.3px }
    .delta{ font-size:12px; display:flex; align-items:center; gap:6px; }
    .delta.up{ color:var(--green) }
    .delta.down{ color:var(--red) }

    /* Donation Details (Chart) */
    .panel-title{ font-weight:800; margin-bottom:10px }
    .chart-wrap{
      background:var(--panel); border-radius:16px; box-shadow:var(--shadow);
      padding:16px;
    }
    .chart-bar{
      background:linear-gradient(180deg,#f8fbff,#fff);
      border:1px solid #eef2f7;
      border-radius:14px; padding:12px;
    }
    .chart-head{
      display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
      color:var(--muted); font-size:14px;
    }
    .select{
      padding:6px 10px; border-radius:10px; border:1px solid #e5e9f2; background:#fff; color:#334155;
    }

    /* Recent Donations */
    .table-wrap{
      background:var(--panel); border-radius:16px; box-shadow:var(--shadow);
      padding:16px;
    }
    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0 8px;
    }
    thead th{
      text-align:left; font-size:12px; color:var(--muted); font-weight:800; padding:10px 12px;
    }
    tbody td{
      background:#fff; padding:14px 12px; font-size:14px;
      border-top:1px solid #eef2f7; border-bottom:1px solid #eef2f7;
    }
    tbody tr td:first-child{ border-left:1px solid #eef2f7; border-top-left-radius:10px; border-bottom-left-radius:10px }
    tbody tr td:last-child{ border-right:1px solid #eef2f7; border-top-right-radius:10px; border-bottom-right-radius:10px }
    .status-pill{
      padding:8px 12px; border-radius:999px; font-weight:700; font-size:12px;
      background:#e8f7ee; color:#0f9d58; display:inline-block;
    }
    .amount{ font-weight:800 }
  </style>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside>
    <div class="brand"><span class="dot"></span> AidReach</div>

    <nav>
      <a class="nav-item active" href="#">
        <span class="nav-icon">📊</span> <span>Dashboard</span>
      </a>
      <a class="nav-item" href="adminCampaigns.html"><span class="nav-icon">🧾</span> Campaigns</a>
      <a class="nav-item" href="users.html"><span class="nav-icon">👥</span> Users</a>
    </nav>

    <!-- Removed sidebar footer; settings and logout moved to profile dropdown -->
  </aside>

  <!-- MAIN -->
  <main>
    <div class="topbar">
      <div class="tb-left">Dashboard</div>
      <div class="tb-right">
        <div class="lang">🇬🇧 English ▾</div>
        <div class="profile-dropdown">
          <div class="avatar"></div>
          <div>
            <strong>SGawd</strong>
            <small>Admin</small>
          </div>
          <span>▾</span>
          <ul class="profile-dropdown-menu">
            <li><a href="settings.html">Settings</a></li>
            <li><a href="Home.html" id="logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>

    <section class="content">
      <!-- Stats row -->
      <div class="stats">
        <div class="card stat">
          <h4>Total Users</h4>
          <div class="icon">👤</div>
          <div class="value" id="stat-total-users">0</div>
        </div>

        <div class="card stat">
          <h4>Total Donations</h4>
          <div class="icon">🧺</div>
          <div class="value" id="stat-total-donations">0</div>
        </div>

        <div class="card stat">
          <h4>Total Campaigns</h4>
          <div class="icon">📈</div>
          <div class="value" id="stat-total-campaigns">0</div>
        </div>

        <div class="card stat">
          <h4>Pending Campaigns</h4>
          <div class="icon">⏱️</div>
          <div class="value" id="stat-pending-campaigns">0</div>
        </div>
      </div>

    <!-- Donation details -->
    <div class="chart-wrap">
      <div class="panel-title">Donation Details</div>
      <div class="chart-bar">
        <div class="chart-head">
        <div>Performance (<span id="chart-month-label"></span>)</div>
        <select id="monthSelect" class="select"></select>
        </div>
        <canvas id="donationChart" height="400" style="width:100%; max-height:250px; height:160px;"></canvas>
      </div>
    </div>

      <!-- Recent donations -->
      <div class="table-wrap">
        <div class="panel-title">Recent Donations</div>
        <div class="chart-head" style="margin-top:-6px">
          <div></div>
          <select id="donationsMonthSelect" class="select"><option value="">All Months</option></select>
        </div>
        <div class="card" style="padding:0">
          <table>
            <thead>
              <tr>
                <th>Donor Name</th>
                <th>Campaign</th>
                <th>Date - Time</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recent-donations"></tbody>
          </table>
        </div>
      </div>

    </section>
  </main>
</div>
<script>
  // Logout handler for the admin dropdown.  Attach a click listener
  // to the anchor with id="logout" to clear admin session data and
  // redirect to the sign up page.
  document.addEventListener("DOMContentLoaded", () => {
    const logoutLink = document.getElementById("logout");
    if (logoutLink) {
      logoutLink.addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.removeItem("loggedInAdmin");
        sessionStorage.removeItem("loggedInAdmin");
        window.location.href = "Sign up.html";
      });
    }
  });
</script>
<!-- admin.html -->
<!-- GLOBAL LOGOUT HANDLER -->
<script src="adminLogout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="./adminDashboard.js"></script>

<!-- adminCampaigns.html -->
<script type="module" src="./adminCampaigns.js"></script>

<!-- users.html -->
<script type="module" src="./usersAdmin.js"></script>

</body>
</html>
